name: Update archive and dashboard

on:
  schedule:
    # Every hour at :07. Each run reads every machine's bins (about 6 minutes),
    # picks up the daily machine list once it's published, and redeploys.
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths-ignore: ["archive/**"]   # the archive commit below shouldn't retrigger
  workflow_dispatch:
    inputs:
      source:
        description: "Where to get new data"
        type: choice
        options: [auto, upstream, direct]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore
    steps:
      - uses: actions/checkout@v7

      - name: Add new days to the archive
        run: python3 scripts/archive.py update --source "${{ inputs.source || 'auto' }}"

      - name: Read every machine's bins
        continue-on-error: true      # a bad hour shouldn't stop the dashboard updating
        timeout-minutes: 25
        run: python3 scripts/bins.py

      - name: Commit the archive
        run: |
          git add archive
          if git diff --cached --quiet; then
            echo "Archive unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive $(date +%Y-%m-%dT%H:%M)"
            git pull --rebase --quiet && git push
          fi

      - name: Build the site
        run: |
          python3 scripts/compile_history.py _site
          cp site/index.html _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
