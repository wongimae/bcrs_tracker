name: Update archive and dashboard

on:
  schedule:
    # Upstream snapshots land between 00:15 and ~02:30 SGT.
    - cron: "0 19 * * *"   # 03:00 SGT
    - cron: "0 1 * * *"    # 09:00 SGT, retry
  push:
    branches: [main]
    paths-ignore: ["archive/**"]   # the archive commit below shouldn't retrigger
  workflow_dispatch:
    inputs:
      source:
        description: "Where to get new data"
        type: choice
        options: [auto, upstream, direct]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore
    steps:
      - uses: actions/checkout@v7

      - name: Add new days to the archive
        run: python3 scripts/archive.py update --source "${{ inputs.source || 'auto' }}"

      - name: Commit the archive
        run: |
          git add archive
          if git diff --cached --quiet; then
            echo "Archive unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Archive $(tail -n1 archive/status.txt | cut -d' ' -f1)"
            git pull --rebase --quiet && git push
          fi

      - name: Build the site
        run: |
          python3 scripts/compile_history.py _site
          cp site/index.html _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
