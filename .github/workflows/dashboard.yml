name: Build dashboard

on:
  schedule:
    # Upstream snapshots land between 00:15 and ~02:30 SGT; build after that.
    - cron: "0 19 * * *"   # 03:00 SGT
    - cron: "0 1 * * *"    # 09:00 SGT, catches late snapshots
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Clone the data repo with full history
        run: git clone --quiet https://github.com/cheeaun/returnright-data.git upstream

      - name: Compile daily history
        run: python3 scripts/compile_history.py upstream _site

      - name: Add the page
        run: cp site/index.html _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
